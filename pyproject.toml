[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sharepoint-rag-oss"
version = "0.1.0"
description = "Vendor-neutral SharePoint -> RAG indexer with pluggable embedding, vector, and LLM backends."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "SharePoint RAG Indexer contributors" }]
keywords = ["sharepoint", "rag", "microsoft-graph", "embeddings", "vector-search", "azure-openai"]

dependencies = [
    "msal>=1.28",
    "requests>=2.31",
    "numpy>=1.24",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
extract = [
    "pypdf>=4.0",
    "python-docx>=1.1",
    "python-pptx>=0.6.23",
    "beautifulsoup4>=4.12",
]
azure = ["openai>=1.30"]
all = [
    "pypdf>=4.0",
    "python-docx>=1.1",
    "python-pptx>=0.6.23",
    "beautifulsoup4>=4.12",
    "openai>=1.30",
]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
sp-rag = "sharepoint_rag.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["sharepoint_rag*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
